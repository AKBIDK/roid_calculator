version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: roi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-roi_calculator}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roi_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-roi_calculator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-roi_secure_password_123}@db:5432/${DB_NAME:-roi_calculator}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-chave_secreta_jwt_producao_super_segura_256}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    driver: local

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
